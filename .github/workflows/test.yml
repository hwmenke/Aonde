name: test
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20  # matches Dockerfile (node:20-alpine); engines >=18
      - run: npm ci
      - run: npm test
      - name: Data audit report
        if: always()
        continue-on-error: true
        run: node scripts/audit-data.js >> "$GITHUB_STEP_SUMMARY"
